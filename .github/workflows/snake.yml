name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency: snake

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      # Coral dots match title.py / design.py palette.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#B44E30&color_dots=#EBEDF0,#FFE1D6,#FBC0A8,#F49A78,#D9694A
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFE0D3&color_dots=#161B22,#4A2A1F,#80422F,#CF6E52,#FFBBA0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
