name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency: snake

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      # Peach dots match the title colors (F4A28C light, FFC6B3 dark).
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#C8553D&color_dots=#EBEDF0,#FDE2D6,#F9C4AD,#F4A28C,#E07A5F
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFE3D6&color_dots=#161B22,#4A2A22,#7D4433,#C46A50,#FFC6B3

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
