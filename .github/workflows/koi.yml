name: Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: platinum
          output-dir: koi
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Trim empty water and draw the pond ring
        shell: bash
        run: |
          sudo apt-get install -y -qq gifsicle fonts-dejavu-core > /dev/null
          gifsicle --batch --crop-transparency koi/koi.gif
          uv run -q --script .github/scripts/pond.py koi/koi.gif koi/koi.gif \
            /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          gifsicle --batch -O3 koi/koi.gif
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
